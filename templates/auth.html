<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة تشيك</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00a896;
            --primary-dark: #028074;
            --primary-light: #e0f7f5;
            --accent: #1a535c;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-light: #4a5568;
            --muted: #8892b0;
            --border: #e2e8f0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --danger: #e63946;
            --success: #2ec4b6;
            --gradient: linear-gradient(135deg, #00a896 0%, #028074 50%, #1a535c 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .floating-shape {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: white;
            border-radius: 50%;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
            animation-delay: 2s;
        }

        .shape-3 {
            width: 150px;
            height: 150px;
            background: white;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            top: 50%;
            left: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: var(--card);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 45px 35px;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-light), transparent);
            opacity: 0.3;
            z-index: -1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: var(--gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
            box-shadow: 0 4px 15px rgba(0, 168, 150, 0.3);
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 10px;
        }

        .auth-header p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: var(--bg);
            padding: 6px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            border-radius: 10px;
            color: var(--muted);
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--card);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 168, 150, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Tajawal', sans-serif;
            color: var(--text);
            background: #fafbfc;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 168, 150, 0.1);
        }

        .form-input::placeholder {
            color: #cbd5e1;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--muted);
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .form-error {
            display: none;
            color: var(--danger);
            font-size: 12px;
            margin-top: 6px;
            animation: slideDown 0.3s ease;
        }

        .form-error.show {
            display: block;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--primary-dark);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 168, 150, 0.3);
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 168, 150, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login.loading {
            color: transparent;
        }

        .btn-login.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auth-footer {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        .auth-footer strong {
            color: var(--text);
            cursor: pointer;
            margin-left: 5px;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-footer a:hover {
            color: var(--primary-dark);
        }

        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 13px;
            animation: slideDown 0.3s ease;
            display: none;
        }

        .alert.show {
            display: flex;
        }

        .alert-icon {
            font-size: 18px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .social-divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--muted);
            font-size: 13px;
        }

        .social-divider::before,
        .social-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .social-divider span {
            padding: 0 10px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-social {
            padding: 12px 16px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 10px;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-social:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }

            .auth-header h1 {
                font-size: 24px;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>

    <div class="container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="logo">✓</div>
                <h1>منصة تشيك</h1>
                <p>منصة آمنة وسهلة لإدارة التقارير الطبية</p>
            </div>

            <!-- Alerts -->
            <div class="alert alert-success" id="successAlert">
                <div class="alert-icon">✓</div>
                <div id="successMessage"></div>
            </div>
            <div class="alert alert-error" id="errorAlert">
                <div class="alert-icon">✕</div>
                <div id="errorMessage"></div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">
                    🔐 تسجيل دخول
                </button>
                <button class="tab-btn" onclick="switchTab('register')">
                    ✏️ إنشاء حساب
                </button>
            </div>

            <!-- Login Form -->
            <div class="form-section active" id="loginForm">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">البريد الإلكتروني</label>
                        <div class="input-wrapper">
                            <input
                                type="email"
                                class="form-input"
                                id="loginEmail"
                                placeholder="example@email.com"
                                required
                            >
                        </div>
                        <div class="form-error" id="loginEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                class="form-input"
                                id="loginPassword"
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                                👁️
                            </button>
                        </div>
                        <div class="form-error" id="loginPasswordError"></div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" id="rememberMe">
                            <span>تذكرني</span>
                        </label>
                        <a href="#" class="forgot-link" onclick="handleForgot(event)">ن��يت كلمة المرور؟</a>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">
                        تسجيل دخول
                    </button>
                </form>

                <div class="social-divider">
                    <span>أو</span>
                </div>

                <div class="social-buttons">
                    <button class="btn-social" title="تسجيل الدخول عبر Google" onclick="socialLogin('google')">
                        🔵
                    </button>
                    <button class="btn-social" title="تسجيل الدخول عبر Apple" onclick="socialLogin('apple')">
                        🍎
                    </button>
                    <button class="btn-social" title="تسجيل الدخول عبر Facebook" onclick="socialLogin('facebook')">
                        👥
                    </button>
                    <button class="btn-social" title="تسجيل الدخول عبر Microsoft" onclick="socialLogin('microsoft')">
                        🤟
                    </button>
                </div>

                <div class="auth-footer">
                    ليس لديك حساب؟
                    <strong onclick="switchTab('register')">إنشاء واحد الآن</strong>
                </div>
            </div>

            <!-- Register Form -->
            <div class="form-section" id="registerForm">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">الاسم الكامل</label>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                class="form-input"
                                id="registerName"
                                placeholder="محمد علي"
                                required
                            >
                        </div>
                        <div class="form-error" id="registerNameError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">اسم المستخدم</label>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                class="form-input"
                                id="registerUsername"
                                placeholder="user123"
                                required
                            >
                        </div>
                        <div class="form-error" id="registerUsernameError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">البريد الإلكتروني</label>
                        <div class="input-wrapper">
                            <input
                                type="email"
                                class="form-input"
                                id="registerEmail"
                                placeholder="example@email.com"
                                required
                            >
                        </div>
                        <div class="form-error" id="registerEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                class="form-input"
                                id="registerPassword"
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('registerPassword')">
                                👁️
                            </button>
                        </div>
                        <div class="form-error" id="registerPasswordError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">تأكيد كلمة المرور</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                class="form-input"
                                id="registerPasswordConfirm"
                                placeholder="••••••••"
                                required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('registerPasswordConfirm')">
                                👁️
                            </button>
                        </div>
                        <div class="form-error" id="registerPasswordConfirmError"></div>
                    </div>

                    <div class="form-group">
                        <label class="checkbox">
                            <input type="checkbox" id="agreeTerms" required>
                            <span>أوافق على <a href="#" class="forgot-link">الشروط والأحكام</a></span>
                        </label>
                        <div class="form-error" id="agreeTermsError"></div>
                    </div>

                    <button type="submit" class="btn-login" id="registerBtn">
                        إنشاء الحساب
                    </button>
                </form>

                <div class="auth-footer">
                    هل لديك حساب بالفعل؟
                    <strong onclick="switchTab('login')">تسجيل دخول</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            }
            clearAlerts();
            clearErrors();
        }

        // Password Toggle
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        // Clear Errors
        function clearErrors() {
            document.querySelectorAll('.form-error').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
        }

        // Clear Alerts
        function clearAlerts() {
            document.getElementById('successAlert').classList.remove('show');
            document.getElementById('errorAlert').classList.remove('show');
        }

        // Show Alert
        function showAlert(message, type = 'success') {
            clearAlerts();
            if (type === 'success') {
                document.getElementById('successMessage').textContent = message;
                document.getElementById('successAlert').classList.add('show');
            } else {
                document.getElementById('errorMessage').textContent = message;
                document.getElementById('errorAlert').classList.add('show');
            }
            setTimeout(clearAlerts, 5000);
        }

        // Show Error
        function showError(fieldId, message) {
            const errorEl = document.getElementById(fieldId + 'Error');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('show');
            }
        }

        // Login Handler
        async function handleLogin(e) {
            e.preventDefault();
            clearErrors();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            // Validation
            if (!email) {
                showError('loginEmail', 'البريد الإلكتروني مطلوب');
                return;
            }
            if (!password) {
                showError('loginPassword', 'كلمة المرور مطلوبة');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showAlert('✓ تم تسجيل الدخول بنجاح');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showAlert(data.detail || 'خطأ في البريد أو كلمة المرور', 'error');
                }
            } catch (error) {
                showAlert('حدث خطأ في الاتصال. حاول لاحقاً', 'error');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // Register Handler
        async function handleRegister(e) {
            e.preventDefault();
            clearErrors();

            const name = document.getElementById('registerName').value;
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            const btn = document.getElementById('registerBtn');

            // Validation
            if (!name) {
                showError('registerName', 'الاسم الكامل مطلوب');
                return;
            }
            if (!username) {
                showError('registerUsername', 'اسم المستخدم مطلوب');
                return;
            }
            if (!email) {
                showError('registerEmail', 'البريد الإلكتروني مطلوب');
                return;
            }
            if (!password) {
                showError('registerPassword', 'كلمة المرور مطلوبة');
                return;
            }
            if (password.length < 8) {
                showError('registerPassword', 'كلمة المرور يجب أن تكون 8 أحرف على الأقل');
                return;
            }
            if (password !== passwordConfirm) {
                showError('registerPasswordConfirm', 'كلمات المرور غير متطابقة');
                return;
            }
            if (!agreeTerms) {
                showError('agreeTerms', 'يجب الموافقة على الشروط والأحكام');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name: name,
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('✓ تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول');
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('loginEmail').value = email;
                        document.getElementById('loginEmail').focus();
                    }, 1500);
                } else {
                    showAlert(data.detail || 'حدث خطأ في إنشاء الحساب', 'error');
                }
            } catch (error) {
                showAlert('حدث خطأ في الاتصال. حاول لاحقاً', 'error');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // Forgot Password
        function handleForgot(e) {
            e.preventDefault();
            showAlert('سيتم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني', 'success');
        }

        // Social Login
        function socialLogin(provider) {
            showAlert(`جاري التوجيه إلى ${provider}...`);
        }
    </script>
</body>
</html>
